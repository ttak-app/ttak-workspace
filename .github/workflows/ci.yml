name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  # Metadata-only edits must not replace running or pending PR validation.
  group: ${{ github.workflow }}-${{ github.event.action == 'edited' && github.event.changes.base == null && format('noop-{0}', github.run_id) || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  harness:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'Harness (metadata edit)' || 'Harness' }}
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.3.0
      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version
      - name: Check harness structure
        run: npm run workflow:harness-check
      - name: Test harness tools
        run: npm run workflow:test

  web:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'Web (metadata edit)' || 'Web' }}
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js and npm download cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.3.0
      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version
      - name: Install workspace dependencies
        run: npm ci
      - name: Lint web
        run: npm run lint:web
      - name: Check web types
        run: npm run check-types:web
      - name: Build web
        run: npm run build:web

  macos-build:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'macOS Build (metadata edit)' || 'macOS Build' }}
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up npm
        run: npm install --global npm@11.3.0
      - name: Show build environment
        run: |
          node --version
          npm --version
          xcodebuild -version
          xcrun swift --version
      - name: Build unsigned macOS app
        run: npm run macos:build
