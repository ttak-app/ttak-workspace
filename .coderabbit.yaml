# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
tone_instructions: "한국어로 간결하게 원인과 개선 방향을 설명하세요. 실제 버그, 상태와 비동기 수명, 권한 및 회귀 위험을 우선하고 기존 규칙에 없는 스타일을 강제하지 마세요. 가운데점(U+00B7)을 사용하지 마세요."

reviews:
  profile: "chill"
  request_changes_workflow: false
  auto_approvals:
    enabled: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  changed_files_summary: true
  review_status: true
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  sequence_diagrams: false
  in_progress_fortune: false
  poem: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "^develop$"
      - "^main$"

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!.tmp/**"
    - "!**/.build/**"
    - "!**/DerivedData/**"
    - "!**/xcuserdata/**"
    - "!**/*.xcuserstate"
    - "!**/.gitkeep"

  path_instructions:
    - path: "apps/macos/**"
      instructions: |
        Swift 6, SwiftUI, macOS 26 이상에서 동작하는 메뉴바 앱입니다.
        기존 Swift 컨벤션과 macOS 개발 기준을 적용하고 iOS, Electron, React 규칙을 옮기지 마세요.
        상태 소유권, actor 격리, 작업 취소와 오래된 분석 결과, 안정 ID, 날짜와 시간대를 확인하세요.
        모델 출력 검증, EventKit 권한, 사용자 확인 전 저장, 부분 성공과 재시도 시 중복 저장을 검토하세요.
        앱 빌드 성공을 모델 품질이나 실제 미리 알림 저장 성공으로 간주하지 마세요.
    - path: "apps/web/**"
      instructions: |
        React, TypeScript, Vite, CSS와 Oxlint로 구성된 랜딩 페이지입니다.
        기존 웹 컨벤션에 따라 상태와 부작용, 안정적인 key, 접근성 및 반응형 동작을 검토하세요.
        현재 별도 서버가 없으므로 API 라이브러리나 전역 상태 및 새로운 아키텍처를 강제하지 마세요.
    - path: "tools/**"
      instructions: |
        Node ESM 실행 도구입니다. 입력 검증, Git 경로와 인자 처리, 실제 종료 코드와 실패 전파를 확인하세요.
        CI는 PR 전체 변경과 실제 소비 관계에 따라 필요한 대상만 선택해야 합니다.
        로컬 작업 증적은 대상 커밋, 명세와 환경이 달라지면 재확인이 필요하며 실패와 미실행을 통과로 바꾸면 안 됩니다.
    - path: ".github/**"
      instructions: |
        main과 develop은 PR 필수, 승인 0명, Merge commit을 사용합니다.
        CI는 기본 PR 이벤트와 변경 경로별 선택 검사 및 CI Result를 사용합니다.
        실행 조건, 최소 권한, 감지 실패, 예상 밖 생략 및 실패 전파를 검토하세요.
        제목이나 본문 편집에 CI를 호출하는 edited 이벤트나 새 병합 정책을 임의로 요구하지 마세요.
    - path: "docs/**"
      instructions: |
        문서의 규칙이 현재 구현과 사용자 합의 및 다른 문서와 일치하는지 확인하세요.
        미검증 항목을 성공으로 표현하거나 제안을 확정 요구사항으로 바꾸지 마세요.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
  tools:
    swiftlint:
      enabled: false
    eslint:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "AGENTS.md,docs/rules/coding-convention.md,docs/rules/git-convention.md"
        applyTo: "**/*"
      - files: "apps/macos/AGENTS.md,docs/rules/swift-coding-convention.md,docs/rules/macos-development.md"
        applyTo: "apps/macos/**"
      - files: "apps/web/AGENTS.md,docs/rules/web-coding-convention.md"
        applyTo: "apps/web/**"

chat:
  auto_reply: false

issue_enrichment:
  planning:
    enabled: false
